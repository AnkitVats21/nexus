# /etc/nginx/conf.d/hub.example.com.conf (or included in nginx http block)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name hub.example.com;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hub.example.com;

    # TLS Certificates (certbot managed)
    ssl_certificate /etc/letsencrypt/live/hub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Shared proxy settings for WebSockets and streaming API
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;

    # Edge WebSockets: authenticated via hub token in hello message
    location /hub/edge {
        auth_basic off;
        proxy_pass http://127.0.0.1:8380;
    }

    # Board WebSockets: legacy/proto 1 boards
    location /hub/board {
        auth_basic off;
        proxy_pass http://127.0.0.1:8380;
    }

    # Dashboard, /api/ws, /api/*, and metrics: protected by basic auth during pilot
    location / {
        auth_basic "Nexus Pilot Access";
        auth_basic_user_file /etc/nginx/.htpasswd-hub;
        proxy_pass http://127.0.0.1:8380;
    }
}
