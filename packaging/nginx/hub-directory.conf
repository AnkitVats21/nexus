# The directory of home hubs (nexus-directory.service), in the hub's server
# block. Exact-match locations, so they win over "location /hub/".
# Behind Cloudflare: the viewer's and the hubs' own addresses come in
# CF-Connecting-IP; the directory trusts X-Real-IP from 127.0.0.1 only.

# The list: no login; each viewer sees only the hubs on their own network.
location = /hub/directory {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_pass http://127.0.0.1:8381;
}

# Home hubs announce themselves: they bring a directory token.
location = /hub/directory/announce {
    client_max_body_size 4k;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_pass http://127.0.0.1:8381;
}
